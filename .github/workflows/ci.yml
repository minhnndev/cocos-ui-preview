name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --group build --python 3.12
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run cocos-ui-preview --export artifacts/demo.png --report artifacts/demo.json
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build --python 3.12
      - run: uv run python scripts/build_macos.py
      - name: Smoke bundled app
        run: '"artifacts/Cocos UI Preview.app/Contents/MacOS/Cocos UI Preview" --smoke-test artifacts/smoke'
      - name: Smoke bundled property editor
        run: '"artifacts/Cocos UI Preview.app/Contents/MacOS/Cocos UI Preview" --editor-smoke-test artifacts/editor-smoke'
      - uses: actions/upload-artifact@v4
        with:
          name: cocos-ui-preview-macos
          path: |
            artifacts/*.zip
            artifacts/*source.tar.gz
            artifacts/SHA256SUMS
            artifacts/build-receipt.json
            artifacts/smoke/
            artifacts/editor-smoke/
